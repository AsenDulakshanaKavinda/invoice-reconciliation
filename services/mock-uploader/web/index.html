<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice intake</title>
  <style>
    :root {
      --bg: #eef2f4;
      --surface: #ffffff;
      --ink: #14212b;
      --muted: #566674;
      --rule: #cfd8de;
      --accent: #0b5c73;
      --accent-ink: #ffffff;
      --ok: #1d6b3f;
      --bad: #a92a22;
      --track: #dde5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f171d;
        --surface: #17222a;
        --ink: #e6edf1;
        --muted: #93a4b0;
        --rule: #2b3a45;
        --accent: #4fb3cf;
        --accent-ink: #0b1a21;
        --ok: #5fc98d;
        --bad: #ff8b82;
        --track: #263540;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
    h2 { font-size: 1.05rem; margin: 40px 0 12px; }
    .lede { margin: 0 0 28px; color: var(--muted); max-width: 60ch; }

    .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }

    .drop {
      position: relative;
      display: block;
      padding: 32px 24px;
      text-align: center;
      border: 2px dashed var(--rule);
      border-radius: 6px;
      cursor: pointer;
      background: var(--surface);
    }
    .drop:hover, .drop.over { border-color: var(--accent); }
    .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
    .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .drop strong { display: block; font-size: 1.05rem; }
    .drop span { color: var(--muted); font-size: 0.925rem; }

    .actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
    button {
      font: inherit; font-weight: 600;
      background: var(--accent); color: var(--accent-ink);
      border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.link {
      background: none; color: var(--accent); padding: 0; font-weight: 600;
      text-decoration: underline; text-underline-offset: 3px;
    }

    .progress { height: 6px; background: var(--track); border-radius: 3px; margin-top: 16px; overflow: hidden; display: none; }
    .progress > div { height: 100%; width: 0; background: var(--accent); }
    #status { margin: 12px 0 0; min-height: 1.5em; }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--bad); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
    th { font-weight: 600; color: var(--muted); font-size: 0.875rem; }
    tr:last-child td { border-bottom: 0; }
    td.file { white-space: normal; word-break: break-word; min-width: 180px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: baseline; }
    .badge.uploaded::before { background: var(--ok); border-radius: 50%; }
    .badge.pending::before { border: 2px solid var(--muted); border-radius: 50%; width: 8px; height: 8px; box-sizing: border-box; }
    .badge.failed::before { background: var(--bad); transform: rotate(45deg); }
    .empty { padding: 28px 20px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Invoice intake</h1>
    <p class="lede">Files go straight from your browser to storage. PDF 20 MB.</p>

    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="application/pdf,image/png,image/jpeg">
      <strong id="dropTitle">Choose an invoice</strong>
      <span id="dropHint">or drop a file here</span>
    </label>

    <div class="actions">
      <button id="uploadBtn" type="button" disabled>Upload invoice</button>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
    <p id="status" role="status" aria-live="polite"></p>

    <h2>Recent invoices</h2>
    <div class="panel">
      <div class="table-wrap" id="listWrap"></div>
    </div>
  </main>

  <script>
    const MAX_BYTES = 20 * 1024 * 1024;
    const ALLOWED = ['application/pdf', 'image/png', 'image/jpeg'];

    const $ = (id) => document.getElementById(id);
    const fileInput = $('fileInput'), uploadBtn = $('uploadBtn'), statusEl = $('status');
    const progress = $('progress'), bar = $('bar'), drop = $('drop');

    let selected = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function setProgress(fraction) {
      progress.style.display = fraction === null ? 'none' : 'block';
      if (fraction !== null) {
        const pct = Math.round(fraction * 100);
        bar.style.width = pct + '%';
        progress.setAttribute('aria-valuenow', String(pct));
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function choose(file) {
      selected = null;
      uploadBtn.disabled = true;
      setProgress(null);
      if (!file) return;
      if (!ALLOWED.includes(file.type)) {
        setStatus('Only PDF, PNG and JPEG files can be uploaded.', 'error');
        return;
      }
      if (file.size === 0) {
        setStatus('That file is empty.', 'error');
        return;
      }
      if (file.size > MAX_BYTES) {
        setStatus('That file is larger than 20 MB.', 'error');
        return;
      }
      selected = file;
      $('dropTitle').textContent = file.name;
      $('dropHint').textContent = formatSize(file.size) + ' · click to choose a different file';
      uploadBtn.disabled = false;
      setStatus('');
    }

    fileInput.addEventListener('change', () => choose(fileInput.files[0]));
    ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) { fileInput.value = ''; choose(file); }
    });

    async function api(path, options) {
      const res = await fetch(path, options);
      let body = null;
      try { body = await res.json(); } catch (_) { /* no JSON body */ }
      if (!res.ok) throw new Error((body && body.error) || 'Request failed (HTTP ' + res.status + ').');
      return body;
    }

    // fetch() cannot report upload progress, so the PUT to storage uses XHR.
    function putFile(url, file, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url);
        xhr.setRequestHeader('Content-Type', file.type);
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error('Storage rejected the file (HTTP ' + xhr.status + '). The upload link may have expired; try again.'));
        };
        xhr.onerror = () => reject(new Error('Could not reach storage. Check that MinIO is running and that it allows requests from this page (CORS).'));
        xhr.send(file);
      });
    }

    async function upload() {
      if (!selected) return;
      const file = selected;
      uploadBtn.disabled = true;
      setProgress(0);
      try {
        setStatus('Preparing upload…');
        const ticket = await api('/api/uploads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, content_type: file.type, size: file.size }),
        });

        setStatus('Uploading…');
        await putFile(ticket.upload_url, file, setProgress);

        setStatus('Verifying…');
        await api('/api/uploads/' + ticket.id + '/complete', { method: 'POST' });

        setProgress(null);
        setStatus('Uploaded ' + file.name + '.', 'ok');
        selected = null;
        fileInput.value = '';
        $('dropTitle').textContent = 'Choose an invoice';
        $('dropHint').textContent = 'or drop a file here';
      } catch (err) {
        setProgress(null);
        setStatus(err.message, 'error');
        uploadBtn.disabled = !selected;
      }
      loadInvoices();
    }
    uploadBtn.addEventListener('click', upload);

    const STATUS_LABEL = { uploaded: 'Stored', pending: 'Pending', failed: 'Rejected' };

    async function loadInvoices() {
      const wrap = $('listWrap');
      let items;
      try {
        items = await api('/api/invoices');
      } catch (err) {
        wrap.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = err.message;
        wrap.appendChild(p);
        return;
      }

      wrap.innerHTML = '';
      if (items.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No invoices yet. Choose a file above to add the first one.';
        wrap.appendChild(p);
        return;
      }

      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>File</th><th class="num">Size</th><th>Status</th><th>Added</th><th></th></tr></thead>';
      const tbody = document.createElement('tbody');

      for (const it of items) {
        const tr = document.createElement('tr');

        const name = document.createElement('td');
        name.className = 'file';
        name.textContent = it.filename;

        const size = document.createElement('td');
        size.className = 'num';
        size.textContent = it.size_bytes ? formatSize(it.size_bytes) : '—';

        const status = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + it.status;
        badge.textContent = STATUS_LABEL[it.status] || it.status;
        status.appendChild(badge);

        const added = document.createElement('td');
        added.textContent = new Date(it.created_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

        const action = document.createElement('td');
        if (it.status === 'uploaded') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'link';
          btn.textContent = 'Download';
          btn.addEventListener('click', async () => {
            try {
              const { download_url } = await api('/api/invoices/' + it.id + '/download');
              window.location.href = download_url;
            } catch (err) {
              setStatus(err.message, 'error');
            }
          });
          action.appendChild(btn);
        }

        tr.append(name, size, status, added, action);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
    }

    loadInvoices();
  </script>
</body>
</html>
