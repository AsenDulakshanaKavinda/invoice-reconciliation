name: invoice-audit

services:
  postgres:
    image: postgres:17.10  
    container_name: invoice_postgres
    environment:
      POSTGRES_DB: invoice_audit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_audit_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: invoice_rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: invoice_minio
    command: server /data --console-address ":9001"
    # Dev only: running as root guarantees the named volume is writable.
    user: "0:0"
    ports:
      - "9000:9000"     # S3 API (presigned URLs point here)
      - "9001:9001"     # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_SERVER_URL: "http://localhost:9000"
      # The upload page is served by the Go backend on :8080, and the browser
      # PUTs to MinIO on :9000, so MinIO must allow that origin.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
    volumes:
      - minio_data:/data

  # Not used by the upload flow yet; reserved for the audit workflow.
  temporal:
    image: temporalio/auto-setup:latest
    container_name: invoice_temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"     # gRPC
      - "8233:8233"     # Web UI

volumes:
  postgres_data:
  minio_data:
